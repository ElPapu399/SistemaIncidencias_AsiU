spring:
  application:
    name: incidenciasback

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:campus_incidencias_db}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

resend:
  api-key: ${RESEND_API_KEY:re_placeholder}

server:
  port: ${PORT:8080}

app:
  upload-dir: ./uploads
  jwt:
    secret: ${JWT_SECRET:AsIU-SistemaIncidencias-JWT-SecretKey-2026-MinLength32!}
    expiration-ms: ${JWT_EXPIRATION:1800000}
  mail:
    from: ${MAIL_FROM:loayzajhosep58@gmail.com}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
