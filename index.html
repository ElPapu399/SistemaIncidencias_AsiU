<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ASIU — Sistema de Gestión de Incidencias Universitarias. Reporte, asignación por especialidad y seguimiento técnico de fallas en laboratorios y campus."
    />
    <meta name="theme-color" content="#0f172a" />
    <script>
      // Aplica la preferencia antes de pintar para evitar un destello del otro tema.
      (() => {
        let preference = 'system';
        try { preference = localStorage.getItem('asiu-theme') || 'system'; } catch { /* Almacenamiento no disponible. */ }
        const theme = preference === 'light' || preference === 'dark'
          ? preference
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0f172a' : '#f1f5f9');
      })();
    </script>
    <meta property="og:title" content="ASIU — Sistema de Incidencias Universitarias" />
    <meta
      property="og:description"
      content="Plataforma universitaria para el reporte, triaje y resolución técnica de incidencias en laboratorios y aulas."
    />
    <meta property="og:type" content="website" />
    <title>ASIU — Sistema de Incidencias Universitarias</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
