spring:
  application:
    name: incidenciasback

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:campus_incidencias_db}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

resend:
  api-key: unused

server:
  port: ${PORT:8080}

app:
  upload-dir: ./uploads
  jwt:
    secret: ${JWT_SECRET:AsIU-SistemaIncidencias-JWT-SecretKey-2026-MinLength32!}
    expiration-ms: ${JWT_EXPIRATION:1800000}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:soporte.asiu@gmail.com}}
  frontend:
    url: ${FRONTEND_URL:https://sistema-incidencias-asiu.onrender.com}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
